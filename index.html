<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubikPilot RTL for Safari</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #16161a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 122, 0, 0.15);
      color: #ff7a00;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .install-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      background: #ff7a00;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(255, 122, 0, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .install-btn:active {
      transform: scale(0.98);
      background: #e06c00;
    }
    .guide {
      margin-top: 24px;
      font-size: 12px;
      color: #71717a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Safari Tool</span>
    <h1>RubikPilot RTL</h1>
    <p>Universal RTL text direction for ChatGPT, Claude, Google AI Studio, and all web platforms.</p>
    
    <!-- لینک آی‌کلود خود را دقیقاً جایگزین لینک زیر کنید -->
    <a href="https://www.icloud.com/shortcuts/dc63cb57a1424291a2a3c89cc17e2087" class="install-btn">
      Install for Safari (1-Click)
    </a>

    <div class="guide">
      Tap the button above, click <strong>Add Shortcut</strong>, then run it anytime from Safari's <strong>Share Menu</strong>.
    </div>
  </div>
</body>
</html>
